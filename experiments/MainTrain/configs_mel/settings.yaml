cbd_threshold: 2
check_for_variability: false
checkpoints: true
chunk_method: hybrid_uss
chunk_size: 12000000000
chunk_training_mode: disabled
default_initial_rows_per_chunk: 500
distributed_vot_mu: 0.684
distributed_vot_sigma: 0.85
household_median_value_of_time:
  1: 6.01
  2: 8.81
  3: 10.44
  4: 12.86
input_table_list:
- filename: households.csv
  index_col: household_id
  keep_columns:
  - home_zone_id
  - income
  - hhsize
  - HHT
  - auto_ownership
  - num_workers
  # HDR household weights (per-cluster multipliers; default 1.0 == no change)
  - w_income
  - w_vot
  recode_columns:
    home_zone_id: land_use.zone_id
  rename_columns:
    HHID: household_id
    PERSONS: hhsize
    TAZ: home_zone_id
    VEHICL: auto_ownership
    workers: num_workers
  tablename: households
- filename: persons.csv
  index_col: person_id
  keep_columns:
  - household_id
  - age
  - PNUM
  - sex
  - pemploy
  - pstudent
  - ptype
  # HDR person CDAP weights (worker/student Mandatory + non-mandatory propensity; 0 == no change)
  - cdap_work_w
  - cdap_student_w
  - cdap_nonmand_w
  rename_columns:
    PERID: person_id
  tablename: persons
- filename: land_use.csv
  index_col: zone_id
  keep_columns:
  - DISTRICT
  - SD
  - county_id
  - TOTHH
  - TOTPOP
  - TOTACRE
  - RESACRE
  - CIACRE
  - TOTEMP
  - AGE0519
  - RETEMPN
  - FPSEMPN
  - HEREMPN
  - OTHEMPN
  - AGREMPN
  - MWTEMPN
  - PRKCST
  - OPRKCST
  - area_type
  - HSENROLL
  - COLLFTE
  - COLLPTE
  - TOPOLOGY
  - TERMINAL
  # HDR land-use weights (default 1.0 == no change)
  - w_parking
  - w_terminal
  - w_employment
  recode_columns:
    zone_id: zero-based
  rename_columns:
    COUNTY: county_id
    TAZ: zone_id
  tablename: land_use
keep_chunk_logs: true
keep_mem_logs: true
log_alt_losers: false
max_value_of_time: 50
min_available_chunk_ratio: 0.05
min_value_of_time: 1
models:
- initialize_landuse
- initialize_households
- compute_accessibility
- school_location
- workplace_location
- auto_ownership_simulate
- free_parking
- cdap_simulate
- mandatory_tour_frequency
- mandatory_tour_scheduling
- joint_tour_frequency
- joint_tour_composition
- joint_tour_participation
- joint_tour_destination
- joint_tour_scheduling
- non_mandatory_tour_frequency
- non_mandatory_tour_destination
- non_mandatory_tour_scheduling
- tour_mode_choice_simulate
- atwork_subtour_frequency
- atwork_subtour_destination
- atwork_subtour_scheduling
- atwork_subtour_mode_choice
- stop_frequency
- trip_purpose
- trip_destination
- trip_purpose_and_destination
- trip_scheduling
- trip_mode_choice
- write_tables
output_tables:
  action: include
  decode_columns:
    households:
      home_zone_id: land_use.zone_id
    land_use:
      zone_id: land_use.zone_id
    persons:
      home_zone_id: land_use.zone_id
      school_zone_id: nonnegative | land_use.zone_id
      workplace_zone_id: nonnegative | land_use.zone_id
    tours:
      destination: land_use.zone_id
      origin: land_use.zone_id
    trips:
      destination: land_use.zone_id
      origin: land_use.zone_id
  h5_store: false
  prefix: final_
  tables:
  - checkpoints
  - accessibility
  - land_use
  - households
  - persons
  - tours
  - trips
  - joint_tour_participants
resume_after: null
rural_threshold: 6
trace_hh_id: null
trace_od: null
urban_threshold: 4
use_shadow_pricing: false
want_dest_choice_sample_tables: false
